name: Import Docker Image to GHCR
on:
  workflow_dispatch:
    inputs:
      source:
        description: Source image (e.g. chaudhryfaisal/llama-swap-cloud:cdd4ca3)
        required: true
        type: string

      dest_tag:
        description: Optional destination tag (leave blank to auto-generate)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute destination image
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          SRC="${{ github.event.inputs.source }}"
          DEST_TAG="${{ github.event.inputs.dest_tag }}"

          DEST_REPO="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          if [ -z "$DEST_TAG" ]; then
            DEST_TAG="$(echo "$SRC" \
              | tr '/:' '-' \
              | tr '[:upper:]' '[:lower:]')"
          fi

          DEST_IMAGE="ghcr.io/${DEST_REPO}:${DEST_TAG}"

          echo "dest_tag=$DEST_TAG" >> "$GITHUB_OUTPUT"
          echo "dest_image=$DEST_IMAGE" >> "$GITHUB_OUTPUT"

          echo "Source      : $SRC"
          echo "Repo        : $DEST_REPO"
          echo "Tag         : $DEST_TAG"
          echo "Destination : $DEST_IMAGE"

      - name: Pull image
        run: docker pull "${{ github.event.inputs.source }}"

      - name: Retag image
        run: |
          docker tag \
            "${{ github.event.inputs.source }}" \
            "${{ steps.vars.outputs.dest_image }}"

      - name: Push image
        run: docker push "${{ steps.vars.outputs.dest_image }}"
