name: llama_cpp

on:
  push:
    branches:
      - llama_cpp
  workflow_dispatch:
    inputs:
      LLAMA_CPP_TAG:
        description: "Override llama_cpp tag (optional)"
        required: false
      CUDA_VERSION:
        description: "Override cuda_version tag (optional)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LLAMA_CPP_TAG: "b9330"
  CUDA_VERSION: "13.0.0"

concurrency:
  group: llama_cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          LLAMA_CPP_TAG="${{ inputs.LLAMA_CPP_TAG || env.LLAMA_CPP_TAG }}"
          CUDA_VERSION="${{ inputs.CUDA_VERSION || env.CUDA_VERSION }}"
          echo "LLAMA_CPP_TAG=$LLAMA_CPP_TAG" >> "$GITHUB_OUTPUT"
          echo "CUDA_VERSION=$CUDA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.versions.outputs.LLAMA_CPP_TAG }}"
          CUDA_VERSION="${{ steps.versions.outputs.CUDA_VERSION }}"
          TARGET="${{ matrix.target }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=$IMAGE:$TARGET-$VERSION-$CUDA_VERSION" >> "$GITHUB_OUTPUT"
          echo "LATEST_TAG=$IMAGE:$TARGET-$CUDA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.VERSION_TAG }}
            ${{ steps.tags.outputs.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            LLAMA_CPP_VERSION=${{ steps.versions.outputs.LLAMA_CPP_VERSION }}

      - name: Sign published image (version tag)
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tags.outputs.VERSION_TAG }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${TAG}@${DIGEST}"

      - name: Sign published image (sha tag)
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tags.outputs.SHA_TAG }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${TAG}@${DIGEST}"
