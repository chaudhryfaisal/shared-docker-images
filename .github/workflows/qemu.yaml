name: qemu

on:
  push:
    branches:
      - qemu
  workflow_dispatch:
    inputs:
      QEMU_VERSION:
        description: "Override qemu version (optional)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  QEMU_VERSION: "10.2.1"

concurrency:
  group: qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - qemu_amd_sev_snp_static_min
          - qemu_amd_sev_snp_static
          - qemu_amd_sev_snp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          QEMU_VERSION="${{ inputs.QEMU_VERSION || env.QEMU_VERSION }}"
          echo "QEMU_VERSION=$QEMU_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.versions.outputs.QEMU_VERSION }}"
          TARGET="${{ matrix.target }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=$IMAGE:$TARGET-$VERSION" >> "$GITHUB_OUTPUT"
          echo "SHA_TAG=$IMAGE:$TARGET-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "LATEST_TAG=$IMAGE:$TARGET" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.VERSION_TAG }}
            ${{ steps.tags.outputs.SHA_TAG }}
            ${{ steps.tags.outputs.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            QEMU_VERSION=${{ steps.versions.outputs.QEMU_VERSION }}

      - name: Sign published image (version tag)
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tags.outputs.VERSION_TAG }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${TAG}@${DIGEST}"

      - name: Sign published image (sha tag)
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tags.outputs.SHA_TAG }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${TAG}@${DIGEST}"
